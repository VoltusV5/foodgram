name: Foodgram CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodgram-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodgram_test
          POSTGRES_USER: foodgram
          POSTGRES_PASSWORD: foodgram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodgram -d foodgram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.3.0 flake8-isort==7.0.0
          pip install -r backend/requirements.txt
      - name: Run lint and Django checks
        env:
          SECRET_KEY: django-insecure-test-key
          POSTGRES_DB: foodgram_test
          POSTGRES_USER: foodgram
          POSTGRES_PASSWORD: foodgram
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          python -m flake8 backend
          python backend/foodgram/manage.py check
          python backend/foodgram/manage.py makemigrations --check --dry-run
          python backend/foodgram/manage.py migrate --noinput

  build_backend:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:${{ github.sha }}

  build_frontend:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_frontend:${{ github.sha }}

  build_gateway:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_gateway:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_backend
      - build_frontend
      - build_gateway
    steps:
      - uses: actions/checkout@v6
      - name: Validate deployment target
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          test "$DEPLOY_HOST" = srv-node.com || test "$DEPLOY_HOST" = 2.27.205.29
          test "$DEPLOY_USER" = admin
          test "$DEPLOY_PORT" = 22222
          test "$DEPLOY_FINGERPRINT" = 'SHA256:Yd94qghKV0QZeV0/lewPM2ee8dl4v9rkOhPAtg2sA5U'
      - name: Copy production Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: infra/docker-compose.production.yml,infra/deploy.sh,infra/backup.sh
          target: /opt/foodgram
          strip_components: 1
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          command_timeout: 15m
          script: |
            set -eu
            bash /opt/foodgram/deploy.sh '${{ secrets.DOCKER_USERNAME }}' '${{ github.sha }}'
            curl --fail --silent --show-error --max-time 30 https://foodgram.srv-node.com/api/recipes/ > /dev/null
