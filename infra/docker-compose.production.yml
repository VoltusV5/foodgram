volumes:
  pg_data:
  static_volume:
  user_files:

services:
  db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: ${DOCKER_USERNAME}/foodgram_backend:latest
    env_file:
      - .env
    volumes:
      - static_volume:/foodgram/collected_static
      - user_files:/foodgram/media
    depends_on:
      - db

  frontend:
    image: ${DOCKER_USERNAME}/foodgram_frontend:latest
    volumes:
      - static_volume:/static

  gateway:
    image: ${DOCKER_USERNAME}/foodgram_gateway:latest
    ports:
      - "80:80"
    volumes:
      - static_volume:/static:ro
      - user_files:/media:ro
    depends_on:
      - backend
      - frontend
