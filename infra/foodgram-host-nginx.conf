server {
    listen 80;
    server_name foodgram-voltusv.duckdns.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name foodgram-voltusv.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/foodgram-voltusv.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodgram-voltusv.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
