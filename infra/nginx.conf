server {
    listen 80;

    server_tokens off;
    client_max_body_size 10M;

    location = /api/docs/ {
        root /usr/share/nginx/html;
        try_files /api/docs/redoc.html =404;
    }

    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
    }

    location /s/ {
        proxy_pass http://backend:8000;
    }

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        root /static;
        try_files $uri $uri/ /index.html;
    }
}
